name: CI/CD📦

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1
  # BUILDKIT_PROGRESS: quiet
  BUILDKIT_PROGRESS: plain

jobs:
  build-and-publish:
    if: github.actor == 'ammnt'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      app_version: ${{ steps.load_env.outputs.APP_VERSION }}
      base_version: ${{ steps.load_env.outputs.BASE_VERSION }}
      base_hash: ${{ steps.load_env.outputs.BASE_HASH }}
      openssl_version: ${{ steps.load_env.outputs.OPENSSL_VERSION }}
      build_date: ${{ steps.load_env.outputs.BUILD_DATE }}
      vcs_ref: ${{ steps.load_env.outputs.VCS_REF }}

    steps:
      - name: Checkout repository📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load .env variables☁️
        id: load_env
        run: |
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^# ]] && [[ -n "$line" ]]; then
              key="${line%%=*}"
              value="${line#*=}"
              echo "$key=$value" >> $GITHUB_OUTPUT
            fi
          done < .env
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_OUTPUT
          echo "VCS_REF=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GHCR🔑
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Login to Docker Hub🔑
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx🏗️
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build Docker image🐳
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          provenance: false
          context: .
          file: ./Dockerfile.template
          platforms: linux/amd64
          load: true
          tags: ghcr.io/ammnt/nginx:${{ steps.load_env.outputs.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_VERSION=${{ steps.load_env.outputs.BASE_VERSION }}
            BASE_HASH=${{ steps.load_env.outputs.BASE_HASH }}
            OPENSSL_VERSION=${{ steps.load_env.outputs.OPENSSL_VERSION }}
            APP_VERSION=${{ steps.load_env.outputs.APP_VERSION }}
            VCS_REF=${{ steps.load_env.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.load_env.outputs.BUILD_DATE }}

      - name: Slim and push image with Mint🔧
        run: |
          curl -sSfL "https://github.com/mintoolkit/mint/releases/latest/download/dist_linux.tar.gz" | tar -zxf -
          ./dist_linux/mint --quiet build \
            --target ghcr.io/ammnt/nginx:${{ steps.load_env.outputs.APP_VERSION }} \
            --tag ghcr.io/ammnt/nginx:${{ steps.load_env.outputs.APP_VERSION }} \
            --tag ghcr.io/ammnt/nginx:latest \
            --tag ammnt/nginx:${{ steps.load_env.outputs.APP_VERSION }} \
            --tag ammnt/nginx:latest \
            --http-probe=false --continue-after=5 \
            --include-path=/etc/shadow --include-path=/etc/group \
            --remove-env PATH \
            --remove-label mintoolkit.version \
            --remove-label mintoolkit.source.image \
            --remove-label mintoolkit.source.image.id
          docker push ghcr.io/ammnt/nginx --all-tags
          docker push ammnt/nginx --all-tags

      - name: Get image digest🔢
        id: digest
        run: |
          DIGEST=$(docker inspect -f='{{index .RepoDigests 0}}' ghcr.io/ammnt/nginx:${{ steps.load_env.outputs.APP_VERSION }} | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Explore with Dive🔍
        env:
          CI: true
        run: |
          export DIVE_VERSION=$(curl -sSfL "https://api.github.com/repos/wagoodman/dive/releases/latest" | jq -r '.tag_name // empty' | sed -E 's/^([0-9][^"]+).*/\1/')
          curl -sSfL "https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.tar.gz" | tar -zxf -
          ./dive --config ./dive-ci.yml -j dive.report.json ghcr.io/ammnt/nginx:${{ steps.load_env.outputs.APP_VERSION }}

      - name: Upload Mint report📁
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mint-report
          path: slim.report.json

      - name: Upload Dive report📁
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dive-report
          path: dive.report.json

      - name: Attest image provenance📜
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          show-summary: false
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Install Cosign🔐
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign images✍️
        env:
          COSIGN_EXPERIMENTAL: "true"
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign -y --key env://COSIGN_KEY ghcr.io/ammnt/nginx@${{ steps.digest.outputs.digest }}
          cosign sign -y --key env://COSIGN_KEY ammnt/nginx@${{ steps.digest.outputs.digest }}

  security-scans:
    needs: build-and-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
      id-token: write
    strategy:
      matrix:
        scanner: [hadolint, checkov, dockle, scout, trivy, grype, snyk, syft]
      fail-fast: false
    steps:
      - name: Checkout repository📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Dockerfile with Hadolint🔍
        if: matrix.scanner == 'hadolint'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: Dockerfile.template
          format: sarif
          output-file: hadolint.sarif
          config: ./hadolint.yaml

      - name: Checkov scan🔍
        if: matrix.scanner == 'checkov'
        run: |
          curl -sSfLO "https://github.com/bridgecrewio/checkov/releases/latest/download/checkov_linux_X86_64.zip"
          unzip -q ./checkov_linux_X86_64.zip
          ./dist/checkov \
            --quiet \
            --output sarif \
            --output-file-path results \
            --framework dockerfile \
            --directory . \
            --dockerfile-path ./Dockerfile.template
          mv results/results_sarif.sarif checkov.sarif

      - name: Dockle scan🛡️
        if: matrix.scanner == 'dockle'
        uses: goodwithtech/dockle-action@e30e6af832aad6ea7dca2a248d31a85eab6dbd68
        with:
          image: ghcr.io/ammnt/nginx:${{ needs.build-and-publish.outputs.app_version }}
          format: sarif
          exit-code: "1"
          exit-level: "warn"
          ignore: "CIS-DI-0005"
          output: "dockle.sarif"

      - name: Docker Scout scan🛡️
        if: matrix.scanner == 'scout'
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d
        with:
          command: cves,sbom
          image: ghcr.io/ammnt/nginx:${{ needs.build-and-publish.outputs.app_version }}
          sarif-file: scout.sarif
          write-comment: true
          summary: false
          exit-code: true
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Trivy scan🛡️
        if: matrix.scanner == 'trivy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/ammnt/nginx:${{ needs.build-and-publish.outputs.app_version }}
          scan-type: image
          format: sarif
          output: trivy.sarif
          severity: "MEDIUM,HIGH,CRITICAL"
          scanners: "vuln,secret"
          exit-code: "1"
          github-pat: ${{ secrets.GH_TOKEN }}
          trivy-config: trivy.yaml

      - name: Grype scan🛡️
        if: matrix.scanner == 'grype'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ghcr.io/ammnt/nginx:${{ needs.build-and-publish.outputs.app_version }}
          fail-build: false
          severity-cutoff: critical
          output-format: sarif
          output-file: grype.sarif

      - name: Snyk scan🛡️
        if: matrix.scanner == 'snyk'
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ghcr.io/ammnt/nginx:${{ needs.build-and-publish.outputs.app_version }}
          sarif: true
          args: --file=Dockerfile.template --sarif-file-output=snyk.sarif

      - name: Generate SBOM with Syft📋
        if: matrix.scanner == 'syft'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: ghcr.io/ammnt/nginx:${{ needs.build-and-publish.outputs.app_version }}
          format: cyclonedx-json
          upload-artifact: true
          dependency-snapshot: true
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Upload ${{ matrix.scanner }} report📁
        if: matrix.scanner != 'syft'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.scanner }}-report
          path: |
            *.sarif
            *.spdx
            *.cyclonedx

      - name: Upload SARIF to Code Scanning🔬
        if: hashFiles('*.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@0c0c5dc2f136b98cb0537075ccfa21f94cd9a63e
        with:
          sarif_file: .
          category: ${{ matrix.scanner }}

  release:
    needs: [build-and-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create tagged release🏷️
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.build-and-publish.outputs.app_version }}
          name: ${{ needs.build-and-publish.outputs.app_version }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Deploy to production server🌐
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USERNAME }}/agh
            /usr/bin/docker compose pull web dns
            /usr/bin/docker compose up -d web dns
            rm -rf ${{ github.workspace }}/*
