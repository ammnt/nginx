name: Renovate🔄

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GH_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
